<title>Origina 健身房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Origina system: light cast-concrete ground (speckle + one form seam with tie holes), translucent white cards r18,
   charcoal primary, pale moss accent. Bottom tab bar of four rooms. Single light theme by choice. */
:root{
  --ground:#d9d7d1;
  --card:rgba(250,249,246,.84);
  --card-solid:#faf9f6;
  --well:#ebe9e4;
  --ink:#232321;
  --ink-2:#605e58;
  --ink-3:#7a7871;
  --line:rgba(60,58,52,.12);
  --moss:#8a9d7f;
  --moss-deep:#56684f;
  --moss-tint:#e1e8da;
  --clay:#8a4c3e;
  --f-display:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 0 0 1px rgba(60,58,52,.10),0 8px 20px -14px rgba(40,36,30,.5);
  /* legacy names used inside templates */
  --chalk:var(--ink);--muted:var(--ink-2);--faint:var(--ink-3);--hair-soft:var(--line);--hair:rgba(60,58,52,.28);--rust:var(--moss-deep);--done:var(--moss);--warn:var(--clay);--concrete-deep:var(--well);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{
  background-color:var(--ground);
  background-image:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,255,255,.45),transparent 70%),radial-gradient(ellipse 50% 35% at 85% 80%,rgba(60,55,48,.09),transparent 70%),radial-gradient(rgba(60,58,52,.10) .8px,transparent 1.1px),radial-gradient(rgba(255,255,255,.35) .7px,transparent 1px);
  background-size:auto,auto,7px 7px,11px 11px;background-position:0 0,0 0,0 0,3px 5px;background-attachment:fixed,fixed,scroll,scroll;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-inline:16px;padding-block:16px 120px;min-height:100%;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative}
.seam{position:absolute;left:-16px;right:-16px;top:36px;height:1px;background:rgba(60,58,52,.14);pointer-events:none}
.seam::before,.seam::after{content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;background:#a9a69f;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.seam::before{left:5px}.seam::after{right:5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss-deep);outline-offset:2px}

.panel{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.tie-b{display:none}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px}
.brand{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.brand b{color:var(--moss-deep);font-weight:500}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.sync.on{color:var(--moss-deep)}

h1.day{font-weight:900;font-size:40px;line-height:1.1;letter-spacing:-.01em;margin:4px 0 2px;text-wrap:balance}
h2{font-weight:700;font-size:18px;margin:0 0 12px;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--well);border-radius:12px;padding:10px 12px}
.stats b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-3)}

/* exercises */
.ex{border-top:1px solid var(--line);padding-top:14px}
.ex:first-child{border-top:0;padding-top:0}
.ex-name{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px;align-items:center}
.set .idx{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:center}
.field{display:flex;align-items:center;background:var(--well);border-radius:10px;padding:0 10px;min-width:0}
.field input{width:100%;min-width:0;background:transparent;border:0;padding:9px 0;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.field input:focus{outline:none}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--moss-deep)}
.field small{font-size:11px;color:var(--ink-3);padding-left:4px;white-space:nowrap}
.check{width:48px;height:40px;border:0;border-radius:10px;background:var(--well);display:grid;place-items:center;font-size:18px;color:var(--ink-3)}
.check.on{color:#fff;background:var(--moss)}
.set.done .field{background:var(--moss-tint)}
.set.done .field input{color:var(--moss-deep)}

.btn{border:0;background:var(--well);padding:9px 14px;font-size:14px;border-radius:10px;min-height:38px}
.btn.solid{background:var(--ink);color:var(--card-solid);font-weight:700}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:13px;min-height:32px;border-radius:9px}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px var(--clay);color:var(--clay)}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--ink-2);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

input.line,textarea.line,select.line{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 2px;color:var(--ink)}
input.line:focus,textarea.line:focus,select.line:focus{outline:none;border-color:var(--moss-deep)}
label.lab{display:flex;flex-direction:column;gap:2px;min-width:0}
label.lab span{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:400px){.grid4{grid-template-columns:1fr 1fr}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:0;background:var(--well);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.week button b{font-size:16px;font-weight:700}
.week button i{font-style:normal;font-size:10px;color:var(--ink-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.week button.on{background:var(--ink);color:var(--card-solid)}
.week button.on i{color:#cfccc5}
.week button.today b{text-decoration:underline;text-decoration-color:var(--moss);text-decoration-thickness:3px;text-underline-offset:4px}

.plan-item{display:grid;grid-template-columns:1fr 54px 54px 64px 30px;gap:8px;align-items:end}
@media (max-width:420px){.plan-item{grid-template-columns:1fr 46px 46px 56px 28px}}
.x{border:0;background:transparent;color:var(--ink-3);font-size:18px;padding:6px 0}

/* records */
.rec{border-top:1px solid var(--line);padding:12px 0}
.rec:first-child{border-top:0;padding-top:0}
.rec summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec summary::-webkit-details-marker{display:none}
.rec .d{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.rec .t{font-weight:700}
.rec ul{margin:10px 0 6px;padding-left:18px;color:var(--ink-2);font-size:14px}
.chip{font-family:var(--f-mono);font-size:11px;background:var(--well);border-radius:6px;padding:2px 7px;color:var(--ink-2);white-space:nowrap}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}

/* timer */
.clock{font-weight:900;font-size:min(28vw,120px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-family:var(--f-mono);letter-spacing:.14em;font-size:12px;color:var(--ink-2)}
.bar{height:5px;background:var(--well);position:relative;overflow:hidden;border-radius:3px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--moss);display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(60,58,52,.10);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 2px;color:var(--ink-2);font-size:14px;border-radius:9px;min-width:0}
.seg button.on{background:var(--card-solid);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.chip.doing{background:var(--moss-tint);color:var(--moss-deep)}.chip.done{background:var(--moss);color:#fff}
.ylesson.done .t{color:var(--ink-2)}
label.lab.ypose{display:grid;grid-template-columns:minmax(0,9em) 1fr;gap:10px;align-items:center;margin:4px 0}label.lab.ypose span{font-size:14px;color:var(--ink)}
textarea.grow{resize:none;overflow:hidden;line-height:1.55}
.empty{color:var(--ink-2);font-size:14px;padding:6px 0}
.note{font-size:12px;color:var(--ink-3)}

/* rest strip + nav */
.rest{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card-solid);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;z-index:5;max-width:560px;margin:0 auto}
.rest .eyebrow{color:#cfccc5}
.rest .num{font-size:20px;font-weight:500}
.rest .bar{flex:1;background:rgba(255,255,255,.15)}
.rest .btn.ghost{color:#e6e4df;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(250,249,246,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr);z-index:6}
nav.tabs button{border:0;background:transparent;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ink-3)}
nav.tabs b{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;font-weight:500}
nav.tabs span{font-size:14px;font-weight:500}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on b{color:var(--moss-deep)}
nav.tabs button.on span{font-weight:700}
/* mannequin stage */
.stage{position:relative;margin:-16px -16px 0;height:min(110vw,420px);touch-action:none;border-radius:18px 18px 0 0;overflow:hidden}
.stage canvas{display:block;width:100%!important;height:100%!important}
.stage .views{position:absolute;right:10px;top:10px;display:flex;gap:2px;background:rgba(250,249,246,.85);border-radius:10px;padding:2px}
.stage .views button{border:0;background:transparent;font-size:12px;padding:5px 8px;color:var(--ink-2);border-radius:8px}
.stage .views button.on{background:var(--ink);color:var(--card-solid)}
.stage .now{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-2);background:rgba(250,249,246,.8);border-radius:6px;padding:1px 6px}
.stage .now:empty{display:none}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:14px;padding:20px;text-align:center}
.moves{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:420px){.moves{grid-template-columns:repeat(2,1fr)}}
.moves button{border:0;background:var(--well);border-radius:10px;padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-width:0}
.moves button b{font-size:15px}
.moves button i{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
.moves button.on{background:var(--moss-tint);color:var(--moss-deep)}
.moves button.on i{color:var(--moss-deep)}

.stage .zlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.stage .zn{position:absolute;left:0;top:0;min-width:18px;height:18px;padding:0 4px;border:1.5px solid;border-radius:9px;background:rgba(250,249,246,.92);font-family:var(--f-mono);font-size:11px;line-height:15px;text-align:center;font-weight:500}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
@media (max-width:420px){.legend{grid-template-columns:1fr}}
.legend li{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:14px;min-width:0}
.zn-l{width:20px;height:20px;border:1.5px solid;border-radius:10px;font-family:var(--f-mono);font-size:11px;font-weight:500;display:grid;place-items:center}
.kchip{font-size:11px;padding:1px 7px;border-radius:6px;white-space:nowrap;color:#fff}
.k-s{background:#4f7896}.k-r{background:#8a6a9a}.k-x{background:#6f8f5f}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.col h3{font-size:15px;margin:0;font-weight:700}
.uses{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:4px}
.lchip{border:0;background:var(--well);padding:5px 10px;font-size:13px;color:var(--ink);border-radius:9px}
.lchip:hover{background:var(--moss-tint);color:var(--moss-deep)}
.thumb{width:64px;height:64px;object-fit:contain;flex:none;background:var(--well);display:block;border-radius:10px;padding:4px}
.thumb.big{width:92px;height:92px;border-radius:12px}
.thumb.ph{background:var(--well);color:var(--ink-2);display:grid;place-items:center;font-size:16px;font-weight:700}
.thumb.big.ph{font-size:22px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:460px){.tools{grid-template-columns:repeat(3,1fr)}}
.tool{border:0;background:transparent;padding:4px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;min-width:0;position:relative;border-radius:12px}
.tool .thumb{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.tool b{font-size:12px;font-weight:500;line-height:1.3}
.tool i{position:absolute;top:8px;right:8px;font-style:normal;font-family:var(--f-mono);font-size:10px;background:var(--ink);color:var(--card-solid);padding:0 5px;border-radius:4px}
.tool.on{background:var(--moss-tint)}
.tool.on b{color:var(--moss-deep);font-weight:700}
.posts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:460px){.posts{grid-template-columns:repeat(3,1fr)}}
.posts button{border:0;background:var(--well);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
.posts button b{font-size:14px}.posts button i{font-style:normal;font-size:11px;color:var(--ink-3)}
.posts button.on{background:var(--moss-tint);color:var(--moss-deep)}
.spark{width:100%;max-width:260px;height:auto;display:block}
.memo{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px;display:flex;flex-direction:column;gap:8px}
.memo b{color:var(--ink)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split p{margin:6px 0 0;font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--clay)}
input[type=range]{accent-color:var(--moss-deep)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="seam" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">Origina · <b>Gym</b></div>
    <div class="sync" id="sync">僅存本機</div>
  </header>
  <main id="main" class="stack"></main>
</div>

<div class="rest" id="rest" hidden>
  <span class="eyebrow">組間休息</span>
  <span class="num" id="restNum">1:30</span>
  <div class="bar"><i id="restBar"></i></div>
  <button class="btn small ghost" data-act="rest-add">+30s</button>

</div>

<nav class="tabs" id="tabs">
  <button data-tab="today"><b>TODAY</b><span>今日</span></button>
  <button data-tab="plan"><b>PLAN</b><span>課表</span></button>
  <button data-tab="move"><b>FIGURE</b><span>人偶</span></button>
  <button data-tab="body"><b>BODY</b><span>身體</span></button>
</nav>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["日","一","二","三","四","五","六"];
const WD_EN=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)};
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};

/* ---------- starter plan (a template she can edit) ---------- */
const STARTER={type:"plan",starter:true,restSec:90,days:{
 1:{title:"上肢・推",items:[{name:"槓鈴臥推",sets:4,reps:8,weight:30},{name:"啞鈴肩推",sets:3,reps:10,weight:8},{name:"三頭下壓",sets:3,reps:12,weight:15}]},
 2:{title:"下肢",items:[{name:"深蹲",sets:4,reps:8,weight:40},{name:"羅馬尼亞硬舉",sets:3,reps:10,weight:30},{name:"腿推",sets:3,reps:12,weight:60}]},
 3:{title:"有氧",items:[{name:"飛輪 30 分鐘",sets:1,reps:30,weight:0}]},
 4:{title:"上肢・拉",items:[{name:"滑輪下拉",sets:4,reps:10,weight:30},{name:"坐姿划船",sets:3,reps:10,weight:25},{name:"二頭彎舉",sets:3,reps:12,weight:6}]},
 5:{title:"臀腿",items:[{name:"臀推",sets:4,reps:10,weight:40},{name:"保加利亞分腿蹲",sets:3,reps:10,weight:6},{name:"髖外展機",sets:3,reps:15,weight:30}]},
 6:{title:"核心＋有氧",items:[{name:"棒式",sets:3,reps:45,weight:0},{name:"死蟲",sets:3,reps:12,weight:0}]},
 0:{title:"休息",items:[]}
}};

/* ---------- store: cloud (db) when available, else this browser ---------- */
const LS="origina.gym.v1";
let docs=new Map(), backend="local", col=null, firstSnap=true;
try{const raw=localStorage.getItem(LS);if(raw)docs=new Map(Object.entries(JSON.parse(raw)));}catch(e){}
const persistLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(Object.fromEntries(docs)));}catch(e){}};
const chains={};
function write(id,data){
  if(data==null)docs.delete(id);else docs.set(id,data);
  if(backend!=="cloud"){persistLocal();return;}
  chains[id]=(chains[id]||Promise.resolve()).then(()=>data==null?col.doc(id).delete():col.doc(id).set(data)).catch(err=>{setSync("同步失敗："+(err&&err.code||"未知"),false)});
}
const timers={};
function writeSoon(id,data,ms=600){docs.set(id,data);clearTimeout(timers[id]);timers[id]=setTimeout(()=>{delete timers[id];write(id,docs.get(id));},ms);}
function setSync(t,on){const el=$("#sync");el.textContent=t;el.classList.toggle("on",!!on);}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    col=db.collection("data/users/"+uid);
    col.onSnapshot(async snap=>{
      const m=new Map(snap.docs.map(d=>[d.id,JSON.parse(JSON.stringify(d.data()||{}))]));
      if(firstSnap){
        firstSnap=false;backend="cloud";setSync("雲端同步中",true);
        if(m.size===0&&docs.size>0){for(const [id,d] of docs){try{await col.doc(id).set(d);}catch(e){}}return;}
      }
      for(const id in timers){if(docs.has(id))m.set(id,docs.get(id));}
      docs=m;persistLocal();safeRender();
    },err=>{setSync("離線，暫存本機",false);backend="local";});
  }catch(e){}
}

function chart(list){
  const pts=list.filter(b=>n(b.weight)>0).slice(-30);
  if(pts.length<2)return `<p class="empty">記錄兩次以上體重，這裡會畫出趨勢線。</p>`;
  const W=340,H=150,L=34,R=12,T=14,B=24;
  const ys=pts.map(p=>n(p.weight));let lo=Math.floor(Math.min(...ys)-.5),hi=Math.ceil(Math.max(...ys)+.5);if(hi-lo<2)hi=lo+2;
  const x=i=>L+(W-L-R)*(i/(pts.length-1)), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(n(p.weight)).toFixed(1)).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="體重趨勢">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--hair-soft)" stroke-width="1" fill="none"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t%1?t.toFixed(1):t}</text>`).join("")}
    <path d="${area}" fill="rgba(243,242,238,.08)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--chalk)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(n(last.weight))}" r="3.5" fill="var(--rust)"/>
    <text x="${L}" y="${H-6}">${esc(pts[0].date.slice(5))}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${esc(last.date.slice(5))}</text>
  </svg>`;
}

/* ---------- timer engine ---------- */
const T={mode:"rest",total:90,left:90,running:false,end:0,work:40,rest:20,rounds:8,round:1,phase:"work",tick:null};
let ac=null,wake=null;
function beep(f=880,d=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
async function lock(on){try{if(on&&navigator.wakeLock&&!wake)wake=await navigator.wakeLock.request("screen");if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null}}
function start(){if(T.left<=0)resetT();T.running=true;T.end=Date.now()+T.left*1000;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}lock(true);loop();}
function pause(){T.running=false;T.left=Math.max(0,(T.end-Date.now())/1000);clearTimeout(T.tick);lock(false);paintT();}
function resetT(){clearTimeout(T.tick);T.running=false;T.round=1;T.phase="work";T.total=T.left=(T.mode==="rest"?T.total:T.work);lock(false);paintT();}
function loop(){
  clearTimeout(T.tick);if(!T.running)return;
  T.left=(T.end-Date.now())/1000;
  if(T.left<=3.05&&T.left>0&&Math.abs(T.left-Math.round(T.left))<.06)beep(660,.08);
  if(T.left<=0){
    if(T.mode==="interval"){
      if(T.phase==="work"&&T.rest>0){T.phase="rest";T.total=T.rest;beep(520,.3);}
      else if(T.round<T.rounds){T.round++;T.phase="work";T.total=T.work;beep(990,.3);}
      else{T.running=false;T.left=0;beep(990,.5);setTimeout(()=>beep(990,.5),600);lock(false);paintT();return;}
      T.left=T.total;T.end=Date.now()+T.total*1000;
    }else{T.running=false;T.left=0;beep(990,.4);setTimeout(()=>beep(990,.4),500);lock(false);paintT();return;}
  }
  paintT();T.tick=setTimeout(loop,100);
}
function paintT(){
  const pct=T.total?Math.max(0,Math.min(1,1-T.left/T.total))*100:0;
  const rest=$("#rest"), showStrip=tab!=="timer"&&T.mode==="rest"&&(T.running||T.left<=0&&T.fromSet);
  rest.hidden=!showStrip;
  $("#restNum").textContent=T.left<=0?"開始下一組":fmt(Math.ceil(T.left));$("#restBar").style.width=pct+"%";
  const c=$("#clock");if(c){c.textContent=fmt(Math.ceil(T.left));$("#tbar").style.width=pct+"%";
    $("#tphase").textContent=T.mode==="rest"?(T.running?"休息中":T.left<=0?"時間到":"準備"):`${T.phase==="work"?"運動":"休息"}・第 ${T.round} / ${T.rounds} 輪`;
    $("#tgo").textContent=T.running?"暫停":"開始";}
}
function restFromSet(){T.mode="rest";T.fromSet=true;T.total=T.left=n(getPlan().restSec)||90;start();}

function stageApply(force){
  if(!S||S.dead)return;
  const key=MV.mode+"|"+(MV.mode==="tool"?MV.tool:MV.mode==="post"?MV.post+MV.pview:"");
  if(key===shownKey&&!force)return;shownKey=key;
  if(MV.mode==="move"){S.clear();S.playMove(MOVES[0]);return;}
  if(MV.mode==="tool"){const t=TOOLS.find(x=>x.id===MV.tool)||TOOLS[0];const p=poseOf(t.pose);
    S.show({pose:p,lift:t.lift,props:t.props,zones:t.zones.map(zc),view:t.view,label:t.name,via:(p.pelvis&&Math.abs(p.pelvis[0])>60)||t.pose==="LONGSIT_L"||t.pose==="STICK"?"lie":null});return;}
  const q=POSTS.find(x=>x.id===MV.post)||POSTS[0];const bad=POSES[q.bad],good={};
  const base={zones:q.zones.map(zc),view:q.view,plumb:q.plumb};
  if(MV.pview==="bad")S.show(Object.assign(base,{pose:bad,label:"現況：「"+q.name+"」"}));
  else if(MV.pview==="good")S.show(Object.assign(base,{pose:good,label:"正確姿勢"}));
  else S.show(Object.assign(base,{loop:[{pose:bad,hold:2.2,label:"現況：「"+q.name+"」"},{pose:good,hold:2.2,label:"正確姿勢"}]}));
}

function spark(id){const pts=ptScores().filter(d=>d.scores&&d.scores[id]!=null).slice(-14);
  if(pts.length<2)return `<span class="note">記錄兩天以上，這裡會出現趨勢。</span>`;
  const W=200,H=44,x=i=>6+(W-12)*i/(pts.length-1),y=v=>6+(H-12)*(1-v/10);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.scores[id]).toFixed(1)).join(" ");const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="近期狀況趨勢"><line x1="6" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="var(--hair-soft)" fill="none"/><path d="${d}" fill="none" stroke="var(--chalk)" stroke-width="1.5"/><circle cx="${x(pts.length-1)}" cy="${y(l.scores[id])}" r="3" fill="var(--rust)"/></svg>`;}

let pendingRender=false;
function render(){
  pendingRender=false;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab||(b.dataset.tab==="today"&&(tab==="log"||tab==="timer"))||(b.dataset.tab==="plan"&&tab==="yoga")));
  main.innerHTML=({today:vToday,log:vLog,plan:vPlan,body:vBody,move:vFigure,timer:vTimer,yoga:vYoga})[tab]();
  main.querySelectorAll("textarea.grow").forEach(t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px";});
  if(tab==="move"&&$("#stageSlot")){const st=buildStage();$("#stageSlot").appendChild(st.el);if(st.start)st.start();stageApply();}
  else if(S&&S.stop)S.stop();
  paintT();
}
function safeRender(){const a=document.activeElement;if(a&&main.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;return;}render();}
main.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender)safeRender();},0));

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]");if(tb){if(tb.dataset.tab==='move'&&tab!=='move')shownKey='';tab=tb.dataset.tab;logConfirm=bodyConfirm=null;render();window.scrollTo(0,0);return;}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  const exEl=b.closest("[data-ex]"), i=exEl?+exEl.dataset.ex:-1;
  const clone=()=>JSON.parse(JSON.stringify(todayWorkout()));
  if(a==="toggle"){const w=clone(),j=+b.closest("[data-set]").dataset.set,s=w.exercises[i].sets[j];s.done=!s.done;saveToday(w);render();if(s.done)restFromSet();}
  else if(a==="add-set"){const w=clone(),ss=w.exercises[i].sets,l=ss[ss.length-1]||{w:"",r:""};ss.push({w:l.w,r:l.r,done:false});saveToday(w);render();}
  else if(a==="del-set"){const w=clone();w.exercises[i].sets.pop();saveToday(w);render();}
  else if(a==="del-ex"){const w=clone();w.exercises.splice(i,1);saveToday(w);render();}
  else if(a==="add-ex"){const v=$("#newEx").value.trim();if(!v)return $("#newEx").focus();const w=clone();w.exercises.push({name:v,sets:[{w:"",r:"",done:false},{w:"",r:"",done:false},{w:"",r:"",done:false}]});saveToday(w);render();}
  else if(a==="rest-add"){T.end+=30000;T.total+=30;if(!T.running){T.left=30;start();}}
  else if(a==="rest-stop"){T.fromSet=false;pause();T.left=T.total;$("#rest").hidden=true;}
  else if(a==="log-del"){logConfirm=b.closest("[data-id]").dataset.id;render();const d=main.querySelector(`[data-id="${CSS.escape(logConfirm)}"]`);if(d)d.open=true;}
  else if(a==="log-del-no"){logConfirm=null;render();}
  else if(a==="log-del-yes"){write(logConfirm,null);if(logConfirm===wid(todayStr()))draft=null;logConfirm=null;render();}
  else if(a==="plan-day"){planDay=+b.dataset.day;render();}
  else if(a==="plan-add"){const p=myPlan();(p.days[planDay]=p.days[planDay]||{title:"",items:[]}).items.push({name:"",sets:3,reps:10,weight:""});write("plan",p);render();const ins=main.querySelectorAll('[data-pk="name"]');ins[ins.length-1]?.focus();}
  else if(a==="plan-del"){const p=myPlan();p.days[planDay].items.splice(+b.closest("[data-i]").dataset.i,1);write("plan",p);render();}
  else if(a==="body-save"){
    const date=$("#bDate").value||todayStr();const rec={type:"body",date,weight:$("#bW").value.trim(),fat:$("#bF").value.trim(),waist:$("#bWa").value.trim(),hip:$("#bH").value.trim(),thigh:$("#bT").value.trim()};
    if(!rec.weight&&!rec.fat&&!rec.waist&&!rec.hip&&!rec.thigh){$("#bMsg").textContent="至少填一個數字再儲存。";return;}
    write("b_"+date,rec);render();const m=$("#bMsg");if(m)m.textContent="已儲存 "+date;}
  else if(a==="body-del"){bodyConfirm=b.closest("[data-id]").dataset.id;render();}
  else if(a==="body-del-no"){bodyConfirm=null;render();}
  else if(a==="body-del-yes"){write(bodyConfirm,null);bodyConfirm=null;render();}
  else if(a==="t-mode"){T.mode=b.dataset.m;T.fromSet=false;if(T.mode==="interval"){T.total=T.left=T.work;}else{T.total=T.left=T.total||90;}resetT();render();}
  else if(a==="t-preset"){T.fromSet=false;clearTimeout(T.tick);T.running=false;T.total=T.left=+b.dataset.s;render();}
  else if(a==="t-go"){T.fromSet=false;T.running?pause():start();}
  else if(a==="t-reset"){resetT();}
  else if(a==="mv"){MV.sel=b.dataset.id;render();const m=MOVES.find(x=>x.id===MV.sel);if(S&&S.playMove&&m)S.playMove(m);}
  else if(a==="mode"){MV.mode=b.dataset.m;render();}
  else if(a==="tool"){MV.tool=b.dataset.id;render();}
  else if(a==="post"){MV.post=b.dataset.id;render();}
  else if(a==="pview"){MV.pview=b.dataset.v;render();}
  else if(a==="go-post"){MV.mode="post";MV.post=b.dataset.id;render();window.scrollTo(0,0);}
  else if(a==="go-tool"){MV.mode="tool";MV.tool=b.dataset.id;render();window.scrollTo(0,0);}
  else if(a==="go-move"){MV.mode="move";MV.sel=b.dataset.id;shownKey="move|";if(S&&S.clear)S.clear();render();window.scrollTo(0,0);const m=MOVES.find(x=>x.id===MV.sel);if(S&&S.playMove&&m)S.playMove(m);}
  else if(a==="y-day"){const y=myYoga(),c=y.courses.find(x=>x.id===b.dataset.c),l=c.lessons[+b.dataset.i],t=todayStr(),k=l.days.indexOf(t);if(k<0){l.days.push(t);if(l.status==="todo")l.status="doing";}else l.days.splice(k,1);write("yoga",y);yOpen=tab==="yoga"?+b.dataset.i:yOpen;render();}
  else if(a==="y-grad"){const y=myYoga(),c=curCourse(y),i=+b.dataset.i;c.lessons[i].status="done";c.lessons[i].grad=todayStr();const nx=c.lessons.findIndex((l,j)=>j>i&&l.status!=="done");if(nx>=0){if(c.lessons[nx].status==="todo")c.lessons[nx].status="doing";yOpen=nx;}else yOpen=null;write("yoga",y);render();}
  else if(a==="y-undo"){const y=myYoga(),c=curCourse(y),i=+b.dataset.i;c.lessons[i].status="doing";c.lessons[i].grad="";yOpen=i;write("yoga",y);render();}
  else if(a==="y-cur"){const y=myYoga();y.cur=b.dataset.c;yOpen=null;write("yoga",y);render();}
  else if(a==="y-new"){yNew=!yNew;render();if(yNew)$("#ycName").focus();}
  else if(a==="y-new-save"){const name=$("#ycName").value.trim();const ls=$("#ycLessons").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!name)return $("#ycName").focus();if(!ls.length)return $("#ycLessons").focus();
    const y=myYoga(),id="c"+Date.now().toString(36);y.courses.push({id,name,src:$("#ycSrc").value.trim(),lessons:ls.map((x,i)=>{const m=x.match(/^(.*?)\s+(\d+)\s*(分鐘|分)?$/);return {name:m?m[1]:x,min:m?+m[2]:"",status:i?"todo":"doing",days:[],note:"",grad:""};}),poses:[]});y.cur=id;yNew=false;yOpen=0;write("yoga",y);render();window.scrollTo(0,0);}
  else if(a==="mv-play"){const m=MOVES.find(x=>x.id===MV.sel);if(S&&S.playMove&&m)S.playMove(m);}
});
function myPlan(){const p=JSON.parse(JSON.stringify(getPlan()));delete p.starter;return p;}

main.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){const ex=t.closest("[data-ex]"),st=t.closest("[data-set]");const w=JSON.parse(JSON.stringify(todayWorkout()));w.exercises[+ex.dataset.ex].sets[+st.dataset.set][t.dataset.k]=t.value;saveToday(w,true);}
  else if(t.id==="todayNote"){const w=JSON.parse(JSON.stringify(todayWorkout()));w.note=t.value;saveToday(w,true);}
  else if(t.dataset.pk){const p=myPlan(),i=+t.closest("[data-i]").dataset.i,k=t.dataset.pk;p.days[planDay].items[i][k]=(k==="name"?t.value:(t.value===""?"":n(t.value)));writeSoon("plan",p);}
  else if(t.dataset.plan){const p=myPlan();if(t.dataset.plan==="title"){(p.days[planDay]=p.days[planDay]||{title:"",items:[]}).title=t.value;}else p.restSec=n(t.value)||90;writeSoon("plan",p);}
  else if(t.id==="tw"||t.id==="tr"||t.id==="tn"){T.work=Math.max(1,n($("#tw").value)|0);T.rest=Math.max(0,n($("#tr").value)|0);T.rounds=Math.max(1,n($("#tn").value)|0);if(!T.running)resetT();}
  else if(t.id==="ptScore"){const id="pt_"+todayStr();const d=JSON.parse(JSON.stringify(docs.get(id)||{type:"posture",date:todayStr(),scores:{}}));d.scores[MV.post]=+t.value;$("#ptScoreV").textContent=t.value;writeSoon(id,d,700);}
  else if(t.id==="ptGoal"){const d=JSON.parse(JSON.stringify(docs.get("pt_goals")||{type:"ptgoals",goals:{}}));d.goals[MV.post]=t.value;writeSoon("pt_goals",d);}
  else if(t.dataset.yn!=null){const y=myYoga();curCourse(y).lessons[+t.dataset.yn].note=t.value;writeSoon("yoga",y);t.style.height="auto";t.style.height=t.scrollHeight+"px";}
  else if(t.dataset.yp!=null){const y=myYoga(),[li,pj]=t.dataset.yp.split("-").map(Number);curCourse(y).lessons[li].poses[pj].note=t.value;writeSoon("yoga",y);}
  else if(t.id==="mvHold"){MV.hold=Math.max(0,Math.min(60,n(t.value)));}
  else if(t.id==="mvReps"){MV.reps=Math.max(1,Math.min(20,n(t.value)|0));}
  else if(t.id==="mvSpeed"){MV.speed=n(t.value)||1;}
  else if(t.id==="bDate"){const ex=docs.get("b_"+t.value)||{};$("#bW").value=ex.weight||"";$("#bF").value=ex.fat||"";$("#bWa").value=ex.waist||"";$("#bH").value=ex.hip||"";$("#bT").value=ex.thigh||"";}
});
main.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("ylesson")){if(d.open)yOpen=+d.dataset.i;else if(yOpen===+d.dataset.i)yOpen=null;}},true);
main.addEventListener("change",e=>{if(e.target.dataset.pk||e.target.dataset.plan){safeRender();}});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newEx"){e.preventDefault();main.querySelector('[data-act="add-ex"]').click();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T.running){wake=null;lock(true);loop();}});

/* date rollover while open */
let shown=todayStr();setInterval(()=>{if(todayStr()!==shown){shown=todayStr();draft=null;safeRender();}},60000);

if(!(window.claude&&window.claude.use)){const sy=$("#sync");if(sy)sy.hidden=true;}
render();connect();
})();
