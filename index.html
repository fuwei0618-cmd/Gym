</head><body>
<title>Origina 健身房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Origina system: light cast-concrete ground (speckle + one form seam with tie holes), translucent white cards r18,
   charcoal primary, pale moss accent. Bottom tab bar of four rooms. Single light theme by choice. */
:root{
  --ground:#d9d7d1;
  --card:rgba(250,249,246,.84);
  --card-solid:#faf9f6;
  --well:#ebe9e4;
  --ink:#232321;
  --ink-2:#605e58;
  --ink-3:#7a7871;
  --line:rgba(60,58,52,.12);
  --moss:#8a9d7f;
  --moss-deep:#56684f;
  --moss-tint:#e1e8da;
  --clay:#8a4c3e;
  --f-display:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 0 0 1px rgba(60,58,52,.10),0 8px 20px -14px rgba(40,36,30,.5);
  /* legacy names used inside templates */
  --chalk:var(--ink);--muted:var(--ink-2);--faint:var(--ink-3);--hair-soft:var(--line);--hair:rgba(60,58,52,.28);--rust:var(--moss-deep);--done:var(--moss);--warn:var(--clay);--concrete-deep:var(--well);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ground)}
body{
  background-color:var(--ground);
  background-image:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,255,255,.45),transparent 70%),radial-gradient(ellipse 50% 35% at 85% 80%,rgba(60,55,48,.09),transparent 70%),radial-gradient(rgba(60,58,52,.10) .8px,transparent 1.1px),radial-gradient(rgba(255,255,255,.35) .7px,transparent 1px);
  background-size:auto,auto,7px 7px,11px 11px;background-position:0 0,0 0,0 0,3px 5px;background-attachment:fixed,fixed,scroll,scroll;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-inline:16px;padding-block:16px 120px;min-height:100%;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;position:relative}
.seam{position:absolute;left:-16px;right:-16px;top:36px;height:1px;background:rgba(60,58,52,.14);pointer-events:none}
.seam::before,.seam::after{content:"";position:absolute;top:10px;width:7px;height:7px;border-radius:50%;background:#a9a69f;box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.seam::before{left:5px}.seam::after{right:5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--moss-deep);outline-offset:2px}

.panel{position:relative;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.tie-b{display:none}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px}
.brand{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.brand b{color:var(--moss-deep);font-weight:500}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.sync.on{color:var(--moss-deep)}

h1.day{font-weight:900;font-size:40px;line-height:1.1;letter-spacing:-.01em;margin:4px 0 2px;text-wrap:balance}
h2{font-weight:700;font-size:18px;margin:0 0 12px;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--well);border-radius:12px;padding:10px 12px}
.stats b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--ink-3)}

/* exercises */
.ex{border-top:1px solid var(--line);padding-top:14px}
.ex:first-child{border-top:0;padding-top:0}
.ex-name{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px;align-items:center}
.set .idx{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);text-align:center}
.field{display:flex;align-items:center;background:var(--well);border-radius:10px;padding:0 10px;min-width:0}
.field input{width:100%;min-width:0;background:transparent;border:0;padding:9px 0;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.field input:focus{outline:none}
.field:focus-within{box-shadow:inset 0 0 0 1.5px var(--moss-deep)}
.field small{font-size:11px;color:var(--ink-3);padding-left:4px;white-space:nowrap}
.check{width:48px;height:40px;border:0;border-radius:10px;background:var(--well);display:grid;place-items:center;font-size:18px;color:var(--ink-3)}
.check.on{color:#fff;background:var(--moss)}
.set.done .field{background:var(--moss-tint)}
.set.done .field input{color:var(--moss-deep)}

.btn{border:0;background:var(--well);padding:9px 14px;font-size:14px;border-radius:10px;min-height:38px}
.btn.solid{background:var(--ink);color:var(--card-solid);font-weight:700}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2)}
.btn.small{padding:5px 10px;font-size:13px;min-height:32px;border-radius:9px}
.btn.danger{background:transparent;box-shadow:inset 0 0 0 1px var(--clay);color:var(--clay)}
.btn:active{transform:translateY(1px)}
.link{background:none;border:0;color:var(--ink-2);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

input.line,textarea.line,select.line{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 2px;color:var(--ink)}
input.line:focus,textarea.line:focus,select.line:focus{outline:none;border-color:var(--moss-deep)}
label.lab{display:flex;flex-direction:column;gap:2px;min-width:0}
label.lab span{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:400px){.grid4{grid-template-columns:1fr 1fr}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{border:0;background:var(--well);border-radius:10px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.week button b{font-size:16px;font-weight:700}
.week button i{font-style:normal;font-size:10px;color:var(--ink-3);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.week button.on{background:var(--ink);color:var(--card-solid)}
.week button.on i{color:#cfccc5}
.week button.today b{text-decoration:underline;text-decoration-color:var(--moss);text-decoration-thickness:3px;text-underline-offset:4px}

.plan-item{display:grid;grid-template-columns:1fr 54px 54px 64px 30px;gap:8px;align-items:end}
@media (max-width:420px){.plan-item{grid-template-columns:1fr 46px 46px 56px 28px}}
.x{border:0;background:transparent;color:var(--ink-3);font-size:18px;padding:6px 0}

/* records */
.rec{border-top:1px solid var(--line);padding:12px 0}
.rec:first-child{border-top:0;padding-top:0}
.rec summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec summary::-webkit-details-marker{display:none}
.rec .d{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.rec .t{font-weight:700}
.rec ul{margin:10px 0 6px;padding-left:18px;color:var(--ink-2);font-size:14px}
.chip{font-family:var(--f-mono);font-size:11px;background:var(--well);border-radius:6px;padding:2px 7px;color:var(--ink-2);white-space:nowrap}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}

/* timer */
.clock{font-weight:900;font-size:min(28vw,120px);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-family:var(--f-mono);letter-spacing:.14em;font-size:12px;color:var(--ink-2)}
.bar{height:5px;background:var(--well);position:relative;overflow:hidden;border-radius:3px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--moss);display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:rgba(60,58,52,.10);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 2px;color:var(--ink-2);font-size:14px;border-radius:9px;min-width:0}
.seg button.on{background:var(--card-solid);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.chip.doing{background:var(--moss-tint);color:var(--moss-deep)}.chip.done{background:var(--moss);color:#fff}
.ylesson.done .t{color:var(--ink-2)}
/* yoga lesson card: landscape storyboard */
.ycard{position:fixed;inset:0;z-index:40;background:var(--ground);background-image:radial-gradient(ellipse 60% 50% at 15% 10%,rgba(255,255,255,.55),transparent 70%),radial-gradient(rgba(60,58,52,.09) .8px,transparent 1.1px);background-size:auto,7px 7px;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));overflow:hidden}
.yc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 24px}
.yc-head h1{margin:2px 0 0;font-size:clamp(24px,3.4vw,34px);font-weight:900;letter-spacing:.02em;line-height:1.1}
.yc-head h1 small{font-family:var(--f-mono);font-weight:500;font-size:.5em;color:var(--moss-deep);margin-right:10px;vertical-align:.35em}
.yc-act{display:flex;align-items:center;gap:8px;flex:none}
.yc-x{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card-solid);box-shadow:var(--shadow);font-size:18px;color:var(--ink-2)}
.yc-flow{display:flex;gap:4px;margin:14px 24px 0;padding:4px;background:rgba(60,58,52,.08);border-radius:14px}
.yc-flow button{all:unset;cursor:pointer;flex:var(--n) 1 0;min-width:0;text-align:center;padding:7px 4px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yc-flow button i{font-style:normal;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--ink-3);margin-left:6px}
.yc-flow button.on{background:var(--card-solid);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.yriver{flex:1;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;padding:16px 24px 10px;align-items:center;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.yriver::-webkit-scrollbar{display:none}
.ygrp{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;scroll-snap-align:start}
.ygrp b{writing-mode:vertical-rl;font-size:20px;font-weight:900;letter-spacing:.3em;color:var(--moss-deep)}
.ygrp i{flex:1;width:1px;background:linear-gradient(var(--moss),transparent);max-height:120px}
.ypc{flex:none;width:clamp(210px,22vw,250px);perspective:1200px;scroll-snap-align:start;cursor:pointer;height:min(100%,520px)}
.ypc.wide{width:clamp(280px,30vw,340px)}
.ypc-in{position:relative;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.ypc.flip .ypc-in{transform:rotateY(180deg)}
.ypc-f,.ypc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card-solid);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ypc-b{transform:rotateY(180deg);padding:18px 16px 14px;gap:8px}
.ypc-img{position:relative;flex:1 1 auto;min-height:150px;background:radial-gradient(ellipse 70% 60% at 50% 38%,#fff,var(--moss-tint) 75%)}
.ypc-img{container-type:size}
.ypc-fig{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);aspect-ratio:var(--ar);width:min(calc(100cqw - 36px),calc((100cqh - 54px) * var(--ar)));z-index:1}
.ypc-fig img{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(40,50,35,.18))}
.ymk{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ymk ellipse.g{fill:rgba(214,96,74,.16)}
.ymk ellipse.s{fill:none;stroke:#cf4f3a;stroke-width:2;vector-effect:non-scaling-stroke}
.ylab{position:absolute;z-index:2;white-space:nowrap;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#b8432f;background:rgba(255,255,255,.94);padding:2px 8px;border-radius:999px;box-shadow:0 1px 3px rgba(60,40,30,.18);pointer-events:none}
.ycard.nomk .ymk,.ycard.nomk .ylab{display:none}
.ypc-story{margin:0;font-size:22px;line-height:1.3;color:#7a5a2e;font-weight:900;letter-spacing:.04em}
.yplay{position:fixed;inset:0;z-index:60;background:var(--ground);background-image:radial-gradient(ellipse 55% 55% at 50% 45%,#fff,var(--moss-tint) 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:pointer;user-select:none}
.yplay .pp-x{position:absolute;top:max(16px,env(safe-area-inset-top));right:20px}
.yplay .pp-pos{font-family:var(--f-mono);font-size:13px;letter-spacing:.2em;color:var(--moss-deep)}
.yplay .pp-img{height:min(52vh,420px);width:min(86vw,760px);display:flex;align-items:flex-end;justify-content:center;margin:10px 0 18px}
.yplay .pp-img img{max-width:100%;max-height:100%;filter:drop-shadow(0 10px 12px rgba(40,50,35,.2));animation:ppIn .7s cubic-bezier(.2,.7,.2,1)}
.yplay .pp-word{font-size:clamp(36px,6vw,64px);font-weight:900;color:#7a5a2e;letter-spacing:.06em;animation:ppUp .6s .1s both}
.yplay .pp-name{margin-top:6px;font-size:15px;color:var(--ink-2);animation:ppUp .6s .2s both}
.yplay .pp-dots{display:flex;gap:6px;margin-top:22px}
.yplay .pp-dots i{width:7px;height:7px;border-radius:50%;background:rgba(60,58,52,.18)}
.yplay .pp-dots i.on{background:var(--moss-deep);width:18px;border-radius:4px}
.yplay .pp-hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));font-size:12px;color:var(--ink-3)}
@keyframes ppIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ppUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.yc-st.on{background:#f6ecd9;color:#7a5a2e;border-color:#e8d3ad}
.ypc-f{transition:visibility 0s .27s}.ypc.flip .ypc-f{visibility:hidden}
.ypc-b{visibility:hidden;transition:visibility 0s .27s}.ypc.flip .ypc-b{visibility:visible}
.yc-flow button em{font-style:normal;font-weight:700;font-size:12px;color:#7a5a2e;margin-left:6px}
.ycard{padding-top:max(10px,env(safe-area-inset-top))}.yc-head h1{font-size:clamp(22px,3vw,30px)}.yc-flow{margin-top:10px}.yriver{padding-top:12px;padding-bottom:8px}
.ycard.story .ypc-t{flex-basis:100px}
.yc-foot{position:relative}
.yc-talebtn{all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:8px;background:#f6ecd9;border:1px solid #e8d3ad;border-radius:999px;padding:6px 14px;font-size:13px;color:#7a5a2e;max-width:100%;box-sizing:border-box}
.yc-talebtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.yc-talebtn i{font-style:normal;font-size:12px;opacity:.75;flex:none}
.yc-talepop{position:absolute;right:24px;bottom:calc(100% + 10px);width:min(440px,calc(100vw - 48px));background:#fffaf1;border:1px solid #e8d3ad;border-radius:18px;box-shadow:0 14px 34px -12px rgba(60,45,20,.35);padding:14px 18px 16px;z-index:5}
.yc-talepop p{margin:8px 0 0;font-size:14px;line-height:1.65;color:var(--ink)}.yc-talepop p b{color:#7a5a2e}
.yc-talepop p.one{margin-top:12px;padding-top:10px;border-top:1px dashed #e8d3ad}
.yc-x.sm{width:30px;height:30px;font-size:14px}
.yc-mk.on{background:#fbe9e5;color:#b8432f;border-color:#efc4ba}
.ypc-img::after{content:"";position:absolute;left:18%;right:18%;bottom:12px;height:8px;border-radius:50%;background:rgba(40,50,35,.12);filter:blur(4px)}
.ypc-n{position:absolute;top:10px;left:14px;font-family:var(--f-mono);font-size:13px;color:var(--moss-deep)}
.ypc-side{position:absolute;top:9px;right:12px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.8);color:var(--ink-2)}
.ypc-t{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:0 0 172px;box-sizing:border-box}
.ypc-t h3{margin:0;font-size:17px;font-weight:900;letter-spacing:.02em}
.ypc-cue{margin:0;font-size:15px;line-height:1.5;color:var(--moss-deep);font-weight:500}
.ypc-prop{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--ink-2);background:var(--well);border-radius:10px;padding:7px 9px}
.ypc-prop b{flex:none;font-size:11px;color:#fff;background:var(--moss);border-radius:6px;padding:1px 6px;margin-top:1px}
.ypc-b h3{margin:0;font-size:15px;font-weight:900}
.ypc-b .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3)}
.ypc-b p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.ypc-b textarea{flex:1;width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--well);padding:8px;font:13px/1.6 var(--f-body);color:var(--ink)}
.ypc-b .row{margin-top:auto}
.ypc-hint{font-size:11px;color:var(--ink-3);text-align:center}
.yc-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 24px 0}
.yc-foot .eyebrow{margin-right:4px}
.yc-foot span.r{font-size:13px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 12px;color:var(--ink)}
.ythumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.ythumbs img{height:46px;flex:none;background:var(--moss-tint);border-radius:8px;padding:4px 6px;object-fit:contain}
@media (orientation:portrait) and (max-width:700px){.yc-head{padding:0 16px}.yc-flow{margin:12px 16px 0}.yriver{padding:14px 16px 8px}.yc-foot{padding:4px 16px 0}.yc-flow button i{display:none}}

label.lab.ypose{display:block;margin:6px 0 10px}label.lab.ypose span{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}label.lab.ypose textarea{width:100%;resize:none;overflow:hidden;font-size:13.5px;line-height:1.6;color:var(--ink-2,#55524c)}
textarea.grow{resize:none;overflow:hidden;line-height:1.55}
.empty{color:var(--ink-2);font-size:14px;padding:6px 0}
.note{font-size:12px;color:var(--ink-3)}

/* rest strip + nav */

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["日","一","二","三","四","五","六"];
const WD_EN=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60)};
const n=v=>{const x=parseFloat(v);return isFinite(x)?x:0};

/* ---------- starter plan (a template she can edit) ---------- */
const STARTER={type:"plan",starter:true,restSec:90,days:{
 1:{title:"上肢・推",items:[{name:"槓鈴臥推",sets:4,reps:8,weight:30},{name:"啞鈴肩推",sets:3,reps:10,weight:8},{name:"三頭下壓",sets:3,reps:12,weight:15}]},
 2:{title:"下肢",items:[{name:"深蹲",sets:4,reps:8,weight:40},{name:"羅馬尼亞硬舉",sets:3,reps:10,weight:30},{name:"腿推",sets:3,reps:12,weight:60}]},
 3:{title:"有氧",items:[{name:"飛輪 30 分鐘",sets:1,reps:30,weight:0}]},
 4:{title:"上肢・拉",items:[{name:"滑輪下拉",sets:4,reps:10,weight:30},{name:"坐姿划船",sets:3,reps:10,weight:25},{name:"二頭彎舉",sets:3,reps:12,weight:6}]},
 5:{title:"臀腿",items:[{name:"臀推",sets:4,reps:10,weight:40},{name:"保加利亞分腿蹲",sets:3,reps:10,weight:6},{name:"髖外展機",sets:3,reps:15,weight:30}]},
 6:{title:"核心＋有氧",items:[{name:"棒式",sets:3,reps:45,weight:0},{name:"死蟲",sets:3,reps:12,weight:0}]},
 0:{title:"休息",items:[]}
}};

/* ---------- store: cloud (db) when available, else this browser ---------- */
const LS="origina.gym.v1";
let docs=new Map(), backend="local", col=null, firstSnap=true;
try{const raw=localStorage.getItem(LS);if(raw)docs=new Map(Object.entries(JSON.parse(raw)));}catch(e){}
const persistLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(Object.fromEntries(docs)));}catch(e){}};
const chains={};
function write(id,data){
  if(data==null)docs.delete(id);else docs.set(id,data);
  if(backend!=="cloud"){persistLocal();return;}
  chains[id]=(chains[id]||Promise.resolve()).then(()=>data==null?col.doc(id).delete():col.doc(id).set(data)).catch(err=>{setSync("同步失敗："+(err&&err.code||"未知"),false)});
}
const timers={};
function writeSoon(id,data,ms=600){docs.set(id,data);clearTimeout(timers[id]);timers[id]=setTimeout(()=>{delete timers[id];write(id,docs.get(id));},ms);}
function setSync(t,on){const el=$("#sync");el.textContent=t;el.classList.toggle("on",!!on);}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    col=db.collection("data/users/"+uid);
    col.onSnapshot(async snap=>{
      const m=new Map(snap.docs.map(d=>[d.id,JSON.parse(JSON.stringify(d.data()||{}))]));
      if(firstSnap){
        firstSnap=false;backend="cloud";setSync("雲端同步中",true);
        if(m.size===0&&docs.size>0){for(const [id,d] of docs){try{await col.doc(id).set(d);}catch(e){}}return;}
      }
      for(const id in timers){if(docs.has(id))m.set(id,docs.get(id));}
      docs=m;persistLocal();safeRender();
    },err=>{setSync("離線，暫存本機",false);backend="local";});
  }catch(e){}
}

/* ---------- derived ---------- */
const getPlan=()=>docs.get("plan")||STARTER;
const workouts=()=>[...docs.entries()].filter(([k,v])=>v&&v.type==="workout").map(([k,v])=>({id:k,...v})).sort((a,b)=>b.date.localeCompare(a.date));
const bodies=()=>[...docs.entries()].filter(([k,v])=>v&&v.type==="body").map(([k,v])=>({id:k,...v})).sort((a,b)=>a.date.localeCompare(b.date));
function draftFromPlan(date){
  const d=new Date(date+"T00:00:00");const p=getPlan().days[d.getDay()]||{title:"自由訓練",items:[]};
  return {type:"workout",date,title:p.title||"自由訓練",note:"",exercises:(p.items||[]).map(it=>({name:it.name,sets:Array.from({length:Math.max(1,it.sets|0)},()=>({w:it.weight??"",r:it.reps??"",done:false}))}))};
}
const wid=date=>"w_"+date;
function todayWorkout(){return docs.get(wid(todayStr()))||draft||(draft=draftFromPlan(todayStr()));}
let draft=null;
function saveToday(w,soon){draft=null;if(soon)writeSoon(wid(w.date),w);else{clearTimeout(timers[wid(w.date)]);delete timers[wid(w.date)];write(wid(w.date),w);}}
const volume=w=>w.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).reduce((a,x)=>a+n(x.w)*n(x.r),0),0);
const doneSets=w=>w.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0);
const allSets=w=>w.exercises.reduce((s,e)=>s+e.sets.length,0);

const POSES01=[["動態摩天式展臂","站"],["動態摩天式提腳跟","站"],["靜態抱肘摩天式","站"],["手臂環抱繞頸式","站"],["手扶膝半蹲起","半蹲"],["手扶膝半蹲繞圈式","半蹲"],["動態貓式","跪"],["跪姿手腕伸展式","跪"],["屈膝肘撐板式","趴"],["肘撐板式","趴"],["動態單腿蝗蟲式（右）","趴"],["動態單腿蝗蟲式（左）","趴"],["單腿坐姿扭轉（左）","坐"],["單腿坐姿扭轉（右）","坐"],["仰臥鎖腿（右）","躺"],["仰臥鎖腿（左）","躺"],["仰臥束角式","躺"],["挺屍式","躺"]].map(([name,pos])=>({name,pos,note:""}));
const DIGEST01={"lesson": "全程節奏：吸氣向上延伸、呼氣放下或加深。\n三個一直出現的提醒：\n① 髖關節（骨盆）穩定：站姿提腳跟、抱肘平衡時\n② 肩膀遠離耳朵、手臂推地拉長頸部：貓式、板式\n③ 小腹收向後背、不塌腰：板式、蝗蟲式\n流程：站 0:28 → 半蹲 4:30 → 跪 5:20 → 趴 9:40 → 坐 11:00 → 躺 13:10（影片時間）\n大休息後起身：先向右側躺，再慢慢起來。", "poses": {"動態摩天式展臂": "口令：雙腳與肩同寬，十指相扣；吸氣翻掌舉過頭、抬頭看手，呼氣翻回放下，做 3 次。肩不舒服可以微彎手肘。\n提示：肋骨往內收，肩膀遠離耳朵。", "動態摩天式提腳跟": "口令：吸氣手臂上舉，同時踮起腳跟；呼氣手落下、腳跟落下，做 3 次。保持髖關節穩定。\n提示：肋骨往內收，肩膀遠離耳朵。\n不夠軟／不穩：提腳跟時一手扶牆。", "靜態抱肘摩天式": "口令：體前互抱手肘，吸氣雙肘舉過頭、踮起腳跟；目視固定一點，停 3 個呼吸，注意力放在髖關節穩定、脊柱立直。\n提示：頭不要往前推。\n不夠軟：抱不到手肘 → 雙手抓彈力帶兩端往上。", "手臂環抱繞頸式": "口令：① 側彎：右手繞過頭頂扶左耳上方，左手指尖輕觸肩膀，呼氣左肩下沉、頭往右延伸，換邊。② 繞環：小臂胸前交叉、雙手扶肩，低頭，頸部向後繞、向前收，兩個方向各 2 圈。\n提示：小圈、慢慢繞，脖子不用力壓；側彎時手只是輕放。\n不夠軟：繞的範圍縮小。", "手扶膝半蹲起": "口令：轉向墊子側邊，雙腳併攏，微彎膝、手扶膝；吸氣伸直膝蓋，呼氣微彎向下，做 4 次。\n提示：膝蓋朝腳尖方向，不往內夾；背打平。\n不夠軟：蹲淺一點。", "手扶膝半蹲繞圈式": "口令：手扶膝，膝蓋左右繞圈各 2 圈，幅度小一點；收回時膝蓋朝正前方。接著手落地，雙腿依次往後退、膝蓋跪地。\n提示：膝蓋朝腳尖方向，不往內夾；背打平。\n不夠軟：蹲淺一點、圈畫小一點。", "動態貓式": "口令：手臂和大腿垂直地板，與肩同寬；腳背平放（想更穩就勾腳趾，腳跟朝正上方不外開）。吸氣抬頭、開胸、尾骨向後，肩膀不聳、手往下推地拉長頸部；呼氣收小腹、弓背低頭看肚臍。做 5 次，把呼吸帶進動作。\n提示：動作從背的中段開始，不只是抬頭。\n不夠軟：膝蓋下墊折好的毛巾。", "跪姿手腕伸展式": "口令：右手掌心向上、指尖朝後，手背落地；吃力就彎右手肘，或試著伸直手臂，找到舒服的位置，感受前臂外側拉伸；做完活動一下手腕，換左手。力量不要過大。\n提示：輕輕的，不要壓到痛。\n不夠軟：手腕只輕輕壓，手肘彎著做。", "屈膝肘撐板式": "口令：手肘落地、大臂垂直地面，雙手相扣；雙膝併攏、勾腳趾。不要塌腰，小腹收向後背（像肚臍貼後背），肩膀和骨盆跟地面平行，停約 5 個呼吸。\n提示：屁股不翹也不塌腰，肚子微收。\n不夠力：先停在屈膝版。", "肘撐板式": "口令：可以屈膝保持，或蹬直膝蓋做肘撐板式；5 個呼吸，持續收緊小腹。結束時膝蓋落下、放平腳背，慢慢趴下。\n提示：屁股不翹也不塌腰，肚子微收。\n不夠力：屈膝版做穩了再換直腿，撐的秒數先減半。", "動態單腿蝗蟲式（右）": "口令：趴著，額頭先落地再換下巴落地，掌心向下壓地，雙腿與肩同寬；小腹微收，吸氣右大腿離地，呼氣輕輕落下，做 3 次。\n提示：兩邊骨盆貼地，腿抬低一點沒關係。\n不夠力：不要用腰硬抬。", "動態單腿蝗蟲式（左）": "口令：吸氣左腿抬起，呼氣輕輕落下，做 3 次。結束時額頭落地，雙手放胸口兩側推地，膝蓋往前挪一小步，坐到墊子上。\n提示：兩邊骨盆貼地，腿抬低一點沒關係。\n不夠力：不要用腰硬抬。", "單腿坐姿扭轉（左）": "口令：彎左膝，左腳掌貼右大腿內側，右腳尖朝天、盡量伸直右膝；右手輕觸左膝，左手指尖點地放臀部後方。吸氣立直脊柱，呼氣左肩往左後方轉，眼睛看左肩延伸線；停 3 個呼吸，每次吸氣往上長、呼氣轉多一點。\n提示：先坐高再轉，背不能圓。\n不夠軟：屁股下坐一塊瑜珈磚（最重要的一個）。", "單腿坐姿扭轉（右）": "口令：伸直左腿，彎右膝，右腳掌貼左大腿內側，左腳尖朝天；左手輕觸右膝，右手指尖點地。吸氣延伸脊椎，呼氣右肩慢慢向後打開，停 3 個呼吸。結束時臀部往前挪，雙手扶大腿、弓背，慢慢躺下。\n提示：先坐高再轉，背不能圓。\n不夠軟：屁股下坐一塊瑜珈磚（最重要的一個）。", "仰臥鎖腿（右）": "口令：屈膝、腳掌踩地，後腦勺平貼墊子，小腹輕收向地面；右膝提起靠近小腹，雙手環抱，左腿慢慢伸直、腳尖朝上。呼氣把大腿拉近小腹，吸氣伸直手臂放鬆，做 3 次。\n提示：下背貼地，肩膀放鬆。\n不夠軟：抱不到膝蓋 → 手抱大腿後側，或用彈力帶。", "仰臥鎖腿（左）": "口令：左膝提起，雙手環抱，右腿慢慢伸直、腳尖朝上；呼氣拉近，吸氣略微放鬆，做 3 次。\n提示：下背貼地，肩膀放鬆。\n不夠軟：抱不到膝蓋 → 手抱大腿後側，或用彈力帶。", "仰臥束角式": "口令：腳跟靠近臀部，雙膝往兩側打開、腳掌相對；雙手放體側、掌心向上，讓膝蓋自然下沉，感受骨盆前側舒展，可以閉眼。結束時雙手扶大腿外側，幫忙把雙膝併攏。\n提示：讓腿自然往外倒，不要往下壓。\n不夠軟：兩邊大腿外側各墊一塊瑜珈磚。", "挺屍式": "口令：雙腿自然分開、腳尖稍朝外，雙手攤在體側、掌心向上，整個背和腿平貼地面；閉眼自然呼吸，想像緊繃的地方變柔軟、貼向地面。要起身時先向右側躺。\n提示：全身放掉。\n不夠舒服：膝蓋下墊滾筒，下背會比較舒服。"}};
POSES01.forEach(x=>{x.note=DIGEST01.poses[x.name]||"";});

function yPlayStep(d){yPI=(yPI+d+yPL.length)%yPL.length;yPlayShow();}
function yPlayTimer(){clearInterval(yPT);if(!yPPause)yPT=setInterval(()=>{if(yPI===yPL.length-1){clearInterval(yPT);yPPause=true;yPlayShow();return;}yPlayStep(1);},2600);}
function yPlayOpen(poses){const POS=["站","半蹲","跪","趴","坐","躺"];yPL=POS.flatMap(ps=>poses.filter(p=>p.pos===ps));if(!yPL.length)return;yPI=0;yPPause=false;
  const el=document.createElement("div");el.className="yplay";el.innerHTML=`<button class="yc-x pp-x" aria-label="關閉">✕</button><div class="pp-pos"></div><div class="pp-img"></div><div class="pp-word"></div><div class="pp-name"></div><div class="pp-dots"></div><div class="pp-hint"></div>`;
  document.body.appendChild(el);let sx=null;
  el.addEventListener("click",e=>{e.stopPropagation();if(e.target.closest(".pp-x")){clearInterval(yPT);el.remove();return;}if(yPPause&&yPI===yPL.length-1){yPI=-1;yPlayStep(1);}yPPause=!yPPause;yPlayShow();yPlayTimer();});
  el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;},{passive:true});
  el.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40){e.preventDefault();yPlayStep(dx<0?1:-1);yPlayTimer();}});
  yPlayShow();yPlayTimer();}

function yFig(nm){const ar=YAR[nm]||1,R=100/ar,mk=YMARK[nm]||[];
  const svg=mk.length?`<svg class="ymk" viewBox="0 0 100 ${R.toFixed(2)}" preserveAspectRatio="none" aria-hidden="true">${mk.map(([x,y,rx,ry])=>`<ellipse class="g" cx="${x}" cy="${(y*R/100).toFixed(2)}" rx="${rx}" ry="${(ry*R/100).toFixed(2)}"/><ellipse class="s" cx="${x}" cy="${(y*R/100).toFixed(2)}" rx="${rx}" ry="${(ry*R/100).toFixed(2)}"/>`).join("")}</svg>`:"";
  const labs=mk.map(([x,y,rx,ry,t,sd])=>{const st=sd==="l"?`left:${x-rx}%;top:${y}%;transform:translate(calc(-100% - 4px),-50%)`:sd==="r"?`left:${x+rx}%;top:${y}%;transform:translate(4px,-50%)`:sd==="t"?`left:${x}%;top:${y-ry}%;transform:translate(-50%,calc(-100% - 4px))`:`left:${x}%;top:${y+ry}%;transform:translate(-50%,4px)`;return `<span class="ylab" style="${st}">${esc(t)}</span>`;}).join("");
  return `<div class="ypc-fig" style="--ar:${ar}"><img src="${YIMG[nm]}" alt="">${svg}${labs}</div>`;}
function yParse(note){const o={cmd:"",cue:"",prop:"",plabel:"不夠軟",rest:[]};String(note||"").split("\n").forEach(l=>{const m=l.match(/^(口令|提示|不夠[^：]*)：(.*)$/);if(!m){if(l.trim())o.rest.push(l);return;}if(m[1]==="口令")o.cmd=m[2];else if(m[1]==="提示")o.cue=m[2];else{o.prop=m[2];o.plabel=m[1].replace(/／.*/,"");}});if(!o.cue&&!o.cmd&&o.rest.length){o.cue=o.rest.shift();}return o;}
function yCardView(c,i){
  const l=c.lessons[i];if(!l)return "";
  const POS=["站","半蹲","跪","趴","坐","躺"],did=l.days.includes(todayStr());

  const rem=String(l.note||"").split("\n").filter(x=>/^[①②③④⑤]/.test(x)).map(x=>x.replace(/：.*$/,""));
  let n=0;
  const river=POS.map(ps=>{const list=l.poses.map((p,j)=>[p,j]).filter(([p])=>p.pos===ps);if(!list.length)return "";
    return `<div class="ygrp" id="yg-${ps}"><b>${ps}</b><i></i></div>`+list.map(([p,j])=>{n++;const t=yParse(p.note),side=(p.name.match(/（(.)）/)||[])[1],nm=p.name.replace(/（.）/,"");
    return `<div class="ypc${YWIDE.has(p.name)?" wide":""}" data-yflip="${j}"><div class="ypc-in">
      <div class="ypc-f"><div class="ypc-img"><span class="ypc-n">${pad(n)}</span>${side?`<span class="ypc-side">${side}側</span>`:""}${YIMG[p.name]?yFig(p.name):""}</div>
        <div class="ypc-t"><h3>${esc(nm)}</h3>${yStory&&YSTORY[p.name]?`<p class="ypc-story">${esc(YSTORY[p.name])}</p>`:t.cue?`<p class="ypc-cue">${esc(t.cue)}</p>`:`<p class="ypc-cue" style="color:var(--ink-3)">點一下寫下提示</p>`}
        ${!yStory&&t.prop?`<div class="ypc-prop"><b>${esc(t.plabel)}</b><span>${esc(t.prop)}</span></div>`:""}</div></div>
      <div class="ypc-b"><span class="lbl">老師怎麼說</span><h3>${esc(p.name)}</h3>
        <textarea id="yp-${i}-${j}" data-yp="${i}-${j}" aria-label="${esc(p.name)} 筆記">${esc(p.note)}</textarea>
        <div class="ypc-hint">直接改，會自動存　·　點卡片外框翻回去</div></div>
    </div></div>`}).join("")}).join("");
  return `<div class="ycard${yMk?"":" nomk"}${yStory?" story":""}" role="dialog" aria-label="課卡">
    <div class="yc-head"><div><div class="eyebrow">${esc(c.name)}${l.min?" · "+l.min+" 分鐘":""}</div><h1><small>${pad(i+1)}</small>${esc(l.name)}</h1></div>
      <div class="yc-act"><button class="btn small solid" data-act="y-play" data-i="${i}">▶ 播放</button><button class="btn small ghost yc-st${yStory?" on":""}" data-act="y-story">📖 故事</button><button class="btn small ghost yc-mk${yMk?" on":""}" data-act="y-mk">◯ 重點圈</button><span class="chip">${YST[l.status]} · 練了 ${l.days.length} 次</span><button class="btn${did?" solid":""}" data-act="y-day" data-c="${esc(c.id)}" data-i="${i}">${did?"今天練了 ✓":"今天練了"}</button><button class="yc-x" data-act="y-card-x" aria-label="關閉">✕</button></div></div>
    <div class="yc-flow">${POS.map((ps,k)=>cnt[k]?`<button data-act="y-jump" data-p="${ps}" style="--n:${cnt[k]}">${ps}${YCHAP[ps]?`<em>${YCHAP[ps]}</em>`:""}${YFLOW[ps]?`<i>${YFLOW[ps]}</i>`:""}</button>`:"").join("")}</div>
    <div class="yriver" id="yriver">${river}<div style="flex:none;width:8px"></div></div>
    <div class="yc-foot">${rem.length?`<span class="eyebrow">一直出現的提醒</span>${rem.map(r=>`<span class="r">${esc(r)}</span>`).join("")}`:""}
      <button class="yc-talebtn" data-act="y-tale">📖 <b>起床、採蘑菇、當貓咪、玩水、找松鼠、抱南瓜睡覺</b><i>看故事 ›</i></button>
      <div class="yc-talepop" hidden><div class="row between"><span class="eyebrow">📖 森林裡的一天</span><button class="yc-x sm" data-act="y-tale" aria-label="收起">✕</button></div>${YTALE.map(t=>`<p>${t}</p>`).join("")}<p class="one">一句話記：<b>起床、採蘑菇、當貓咪、玩水、找松鼠、抱南瓜睡覺。</b></p></div></div>
  </div>`;
}

const YST={todo:"未開始",doing:"消化中",done:"畢業"};
const planSeg=()=>tab==="yoga"?`<button class="link back" data-tab="plan">← 課表</button>`:"";

const ACTS=[["yoga","瑜伽"],["hh","HH"],["pilates","皮拉提斯"]];
const actsOf=k=>(getPlan().days[k]||{}).acts||["yoga"];
function yogaCard(){
  const y=yoga(),c=curCourse(y);if(!c)return "";
  const i=c.lessons.findIndex(l=>l.status!=="done");if(i<0)return "";
  const l=c.lessons[i],did=l.days.includes(todayStr());
  return `<section class="panel"><div class="row between"><div><div class="eyebrow">瑜伽 · ${esc(c.name)}</div>
    <div class="ex-name" style="margin-top:4px">第 ${i+1} 堂　${esc(l.name)}</div><div class="note">已練 ${l.days.length} 次</div></div>
    <button class="btn${did?" solid":""}" data-act="y-day" data-c="${esc(c.id)}" data-i="${i}">${did?"今天練了 ✓":"今天練了"}</button></div></section>`;
}
function todayExtras(){
  const a=actsOf(new Date().getDay());let h="";
  if(a.includes("yoga"))h+=yogaCard();
  if(a.includes("hh"))h+=`<a class="panel extra" href="hh/"><div><div class="eyebrow">HH · 高跟鞋課</div><div class="ex-name" style="margin-top:4px">今天有 HH</div><div class="note">打開 HH 舞蹈筆記，複習影片和段落</div></div><span class="go">›</span></a>`;
  if(a.includes("pilates"))h+=`<section class="panel"><div class="eyebrow">皮拉提斯</div><div class="ex-name" style="margin-top:4px">今天有皮拉提斯課</div><div class="note">上完在下面「今日筆記」記一句感覺</div></section>`;
  return h;
}
function vYoga(){
  const y=yoga(),c=curCourse(y);
  const done=c.lessons.filter(l=>l.status==="done").length,all=c.lessons.length;

    <details class="rec ylesson ${l.status}" data-i="${i}" ${yOpen===i?"open":""}>
      <summary><span><span class="d">${pad(i+1)}${l.min?"・"+l.min+" 分鐘":""}</span><br><span class="t">${esc(l.name)}</span></span>

        <div class="row" style="flex-wrap:wrap;gap:8px">

          ${l.status==="done"?`<span class="note">${esc(l.grad)} 畢業</span><button class="link" data-act="y-undo" data-i="${i}">取消畢業</button>`:`<button class="btn ghost" data-act="y-grad" data-i="${i}">畢業 → 下一堂</button>`}
        </div>
        ${l.poses.length?`<div class="ythumbs" data-act="y-card" data-i="${i}">${l.poses.map(p=>YIMG[p.name]?`<img src="${YIMG[p.name]}" alt="${esc(p.name)}">`:"").join("")}</div>
        <p class="note" style="margin:0">📖 ${["站","半蹲","跪","趴","坐","躺"].filter(ps=>l.poses.some(x=>x.pos===ps)).map(ps=>YCHAP[ps]).join(" → ")}</p>
        <button class="btn solid" data-act="y-card" data-i="${i}">打開課卡（${l.poses.length} 個體式）⤢</button>`:""}
        ${l.days.length?`<p class="note" style="margin:0">練習日：${l.days.slice().sort().map(d=>d.slice(5).replace("-","/")).join("、")}</p>`:""}

  const others=y.courses.filter(x=>x.id!==c.id);
  return (yCard!=null?yCardView(c,yCard):"")+planSeg()+`

     :""}

function chart(list){
  const pts=list.filter(b=>n(b.weight)>0).slice(-30);
  if(pts.length<2)return `<p class="empty">記錄兩次以上體重，這裡會畫出趨勢線。</p>`;
  const W=340,H=150,L=34,R=12,T=14,B=24;
  const ys=pts.map(p=>n(p.weight));let lo=Math.floor(Math.min(...ys)-.5),hi=Math.ceil(Math.max(...ys)+.5);if(hi-lo<2)hi=lo+2;
  const x=i=>L+(W-L-R)*(i/(pts.length-1)), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(n(p.weight)).toFixed(1)).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="體重趨勢">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--hair-soft)" stroke-width="1" fill="none"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t%1?t.toFixed(1):t}</text>`).join("")}
    <path d="${area}" fill="rgba(243,242,238,.08)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--chalk)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(n(last.weight))}" r="3.5" fill="var(--rust)"/>
    <text x="${L}" y="${H-6}">${esc(pts[0].date.slice(5))}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${esc(last.date.slice(5))}</text>
  </svg>`;
}

/* ---------- timer engine ---------- */
const T={mode:"rest",total:90,left:90,running:false,end:0,work:40,rest:20,rounds:8,round:1,phase:"work",tick:null};
let ac=null,wake=null;
function beep(f=880,d=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d);}catch(e){}}
async function lock(on){try{if(on&&navigator.wakeLock&&!wake)wake=await navigator.wakeLock.request("screen");if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null}}
function start(){if(T.left<=0)resetT();T.running=true;T.end=Date.now()+T.left*1000;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}lock(true);loop();}
function pause(){T.running=false;T.left=Math.max(0,(T.end-Date.now())/1000);clearTimeout(T.tick);lock(false);paintT();}
function resetT(){clearTimeout(T.tick);T.running=false;T.round=1;T.phase="work";T.total=T.left=(T.mode==="rest"?T.total:T.work);lock(false);paintT();}
function loop(){
  clearTimeout(T.tick);if(!T.running)return;
  T.left=(T.end-Date.now())/1000;
  if(T.left<=3.05&&T.left>0&&Math.abs(T.left-Math.round(T.left))<.06)beep(660,.08);
  if(T.left<=0){
    if(T.mode==="interval"){
      if(T.phase==="work"&&T.rest>0){T.phase="rest";T.total=T.rest;beep(520,.3);}
      else if(T.round<T.rounds){T.round++;T.phase="work";T.total=T.work;beep(990,.3);}
      else{T.running=false;T.left=0;beep(990,.5);setTimeout(()=>beep(990,.5),600);lock(false);paintT();return;}
      T.left=T.total;T.end=Date.now()+T.total*1000;
    }else{T.running=false;T.left=0;beep(990,.4);setTimeout(()=>beep(990,.4),500);lock(false);paintT();return;}
  }
  paintT();T.tick=setTimeout(loop,100);
}
function paintT(){
  const pct=T.total?Math.max(0,Math.min(1,1-T.left/T.total))*100:0;
  const rest=$("#rest"), showStrip=tab!=="timer"&&T.mode==="rest"&&(T.running||T.left<=0&&T.fromSet);
  rest.hidden=!showStrip;
  $("#restNum").textContent=T.left<=0?"開始下一組":fmt(Math.ceil(T.left));$("#restBar").style.width=pct+"%";
  const c=$("#clock");if(c){c.textContent=fmt(Math.ceil(T.left));$("#tbar").style.width=pct+"%";
    $("#tphase").textContent=T.mode==="rest"?(T.running?"休息中":T.left<=0?"時間到":"準備"):`${T.phase==="work"?"運動":"休息"}・第 ${T.round} / ${T.rounds} 輪`;
    $("#tgo").textContent=T.running?"暫停":"開始";}
}
function restFromSet(){T.mode="rest";T.fromSet=true;T.total=T.left=n(getPlan().restSec)||90;start();}

    `<div class="grid2" style="grid-template-columns:repeat(3,1fr)">

}

function stageApply(force){

  if(key===shownKey&&!force)return;shownKey=key;

  if(MV.mode==="tool"){const t=TOOLS.find(x=>x.id===MV.tool)||TOOLS[0];const p=poseOf(t.pose);
    S.show({pose:p,lift:t.lift,props:t.props,zones:t.zones.map(zc),view:t.view,label:t.name,via:(p.pelvis&&Math.abs(p.pelvis[0])>60)||t.pose==="LONGSIT_L"||t.pose==="STICK"?"lie":null});return;}
  const q=POSTS.find(x=>x.id===MV.post)||POSTS[0];const bad=POSES[q.bad],good={};
  const base={zones:q.zones.map(zc),view:q.view,plumb:q.plumb};
  if(MV.pview==="bad")S.show(Object.assign(base,{pose:bad,label:"現況：「"+q.name+"」"}));
  else if(MV.pview==="good")S.show(Object.assign(base,{pose:good,label:"正確姿勢"}));
  else S.show(Object.assign(base,{loop:[{pose:bad,hold:2.2,label:"現況：「"+q.name+"」"},{pose:good,hold:2.2,label:"正確姿勢"}]}));
}

function spark(id){const pts=ptScores().filter(d=>d.scores&&d.scores[id]!=null).slice(-14);
  if(pts.length<2)return `<span class="note">記錄兩天以上，這裡會出現趨勢。</span>`;
  const W=200,H=44,x=i=>6+(W-12)*i/(pts.length-1),y=v=>6+(H-12)*(1-v/10);
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.scores[id]).toFixed(1)).join(" ");const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="近期狀況趨勢"><line x1="6" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="var(--hair-soft)" fill="none"/><path d="${d}" fill="none" stroke="var(--chalk)" stroke-width="1.5"/><circle cx="${x(pts.length-1)}" cy="${y(l.scores[id])}" r="3" fill="var(--rust)"/></svg>`;}

  else if(a==="y-story"){yStory=!yStory;render();}
  else if(a==="y-card-x"){yCard=null;render();}
  else if(a==="y-jump"){const g=document.getElementById("yg-"+b.dataset.p),r=$("#yriver");if(g&&r)r.scrollTo({left:g.offsetLeft-r.offsetLeft-8,behavior:"smooth"});}
  else if(a==="y-cur"){const y=myYoga();y.cur=b.dataset.c;yOpen=null;write("yoga",y);render();}
  else if(a==="y-new"){yNew=!yNew;render();if(yNew)$("#ycName").focus();}
  else if(a==="y-new-save"){const name=$("#ycName").value.trim();const ls=$("#ycLessons").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!name)return $("#ycName").focus();if(!ls.length)return $("#ycLessons").focus();
    const y=myYoga(),id="c"+Date.now().toString(36);y.courses.push({id,name,src:$("#ycSrc").value.trim(),lessons:ls.map((x,i)=>{const m=x.match(/^(.*?)\s+(\d+)\s*(分鐘|分)?$/);return {name:m?m[1]:x,min:m?+m[2]:"",status:i?"todo":"doing",days:[],note:"",grad:""};}),poses:[]});y.cur=id;yNew=false;yOpen=0;write("yoga",y);render();window.scrollTo(0,0);}
  else if(a==="mv-play"){const m=MOVES.find(x=>x.id===MV.sel);if(S&&S.playMove&&m)S.playMove(m);}
});
function myPlan(){const p=JSON.parse(JSON.stringify(getPlan()));delete p.starter;return p;}

main.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.k){const ex=t.closest("[data-ex]"),st=t.closest("[data-set]");const w=JSON.parse(JSON.stringify(todayWorkout()));w.exercises[+ex.dataset.ex].sets[+st.dataset.set][t.dataset.k]=t.value;saveToday(w,true);}
  else if(t.id==="todayNote"){const w=JSON.parse(JSON.stringify(todayWorkout()));w.note=t.value;saveToday(w,true);}
  else if(t.dataset.pk){const p=myPlan(),i=+t.closest("[data-i]").dataset.i,k=t.dataset.pk;p.days[planDay].items[i][k]=(k==="name"?t.value:(t.value===""?"":n(t.value)));writeSoon("plan",p);}
  else if(t.dataset.plan){const p=myPlan();if(t.dataset.plan==="title"){(p.days[planDay]=p.days[planDay]||{title:"",items:[]}).title=t.value;}else p.restSec=n(t.value)||90;writeSoon("plan",p);}
  else if(t.id==="tw"||t.id==="tr"||t.id==="tn"){T.work=Math.max(1,n($("#tw").value)|0);T.rest=Math.max(0,n($("#tr").value)|0);T.rounds=Math.max(1,n($("#tn").value)|0);if(!T.running)resetT();}
  else if(t.id==="ptScore"){const id="pt_"+todayStr();const d=JSON.parse(JSON.stringify(docs.get(id)||{type:"posture",date:todayStr(),scores:{}}));d.scores[MV.post]=+t.value;$("#ptScoreV").textContent=t.value;writeSoon(id,d,700);}
  else if(t.id==="ptGoal"){const d=JSON.parse(JSON.stringify(docs.get("pt_goals")||{type:"ptgoals",goals:{}}));d.goals[MV.post]=t.value;writeSoon("pt_goals",d);}
  else if(t.dataset.yn!=null){const y=myYoga();curCourse(y).lessons[+t.dataset.yn].note=t.value;writeSoon("yoga",y);t.style.height="auto";t.style.height=t.scrollHeight+"px";}
  else if(t.dataset.yp!=null){const y=myYoga(),[li,pj]=t.dataset.yp.split("-").map(Number);curCourse(y).lessons[li].poses[pj].note=t.value;writeSoon("yoga",y);t.style.height="auto";t.style.height=t.scrollHeight+"px";}
  else if(t.id==="mvHold"){MV.hold=Math.max(0,Math.min(60,n(t.value)));}
  else if(t.id==="mvReps"){MV.reps=Math.max(1,Math.min(20,n(t.value)|0));}
  else if(t.id==="mvSpeed"){MV.speed=n(t.value)||1;}
  else if(t.id==="bDate"){const ex=docs.get("b_"+t.value)||{};$("#bW").value=ex.weight||"";$("#bF").value=ex.fat||"";$("#bWa").value=ex.waist||"";$("#bH").value=ex.hip||"";$("#bT").value=ex.thigh||"";}
});
main.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("ylesson")){if(d.open)yOpen=+d.dataset.i;else if(yOpen===+d.dataset.i)yOpen=null;}},true);
main.addEventListener("change",e=>{if(e.target.dataset.pk||e.target.dataset.plan){safeRender();}});
main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="newEx"){e.preventDefault();main.querySelector('[data-act="add-ex"]').click();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T.running){wake=null;lock(true);loop();}});

/* date rollover while open */
let shown=todayStr();setInterval(()=>{if(todayStr()!==shown){shown=todayStr();draft=null;safeRender();}},60000);

if(!(window.claude&&window.claude.use)){const sy=$("#sync");if(sy)sy.hidden=true;}
render();connect();
})();
