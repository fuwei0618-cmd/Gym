<style>

  --skin1:#5a4c40; --skin2:#6b5b4d; --skinl:#c8b4a0; --hair:#2e2520; color-scheme:dark}}

  --skin1:#5a4c40; --skin2:#6b5b4d; --skinl:#c8b4a0; --hair:#2e2520; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}

function persist(){
  if(INAPP&&!loaded)return;
  const data={flow,notes};
  try{localStorage.setItem("origina.posture",JSON.stringify(data))}catch(e){}
  if(INAPP)try{parent.postMessage({pg:"set",data},location.origin)}catch(e){}
}
function applyState(d){flow=Array.isArray(d&&d.flow)?d.flow:SAMPLE.slice();notes=(d&&d.notes)||{};}
try{const raw=localStorage.getItem("origina.posture");applyState(raw?JSON.parse(raw):null)}catch(e){applyState(null)}
const save=()=>{document.getElementById("cnt").textContent=flow.length};

   ${p.s.map((list,si)=>`<div class="cell ${ST[si].c}" style="opacity:${CW?op(CW[si]):1}"><span class="lane">${ST[si].k}</span>${list.length?list.map((it,ii)=>{const k=key(p.id,si,ii);return `<button class="chip ${onTonight(k)?"in":""}" data-k="${k}">
     <span class="ph ${it.img?"":"hand"}">${ph(it)}</span><span class="nm">${it.n}${it.mark?`<span class="tag">${it.mark}</span>`:""}${it.sub&&it.sub!=="徒手"?`<small>${it.sub}</small>`:""}</span><span class="ck"></span></button>`}).join(""):`<div class="empty">${si===3?"—":"之後放床上動作"}</div>`}</div>`).join("")}
  </div>`).join("");

function pick(pi,scroll){
  document.querySelectorAll(".row,.dot").forEach(e=>e.classList.toggle("on",+e.dataset.p===pi));
  if(scroll)document.getElementById("r-"+PARTS[pi].id).scrollIntoView({behavior:"smooth",block:"start"});
}
document.addEventListener("click",e=>{
  const d=e.target.closest(".dot");if(d){if(!$("#rx").hidden){const id=PARTS[+d.dataset.p].id;if(id==="pec"||id==="neck"){openPain("neck");return}if(id==="psoas"||id==="lowback"||id==="abs"){openPain("waist");return}view("table");}pick(+d.dataset.p,true);return}
  const pt=e.target.closest(".part");if(pt){pick(+pt.dataset.p,false);return}

 {id:"sleep",r:0,t:"好睡",mix:{len:40,str:5,ctl:30,rec:100},kw:{len:"睡前鬆肩頸、腹部",ctl:"360° 呼吸",rec:"睡前流程、關燈放鬆"},parts:["neck","abs"],test:"幾點睡、半夜醒幾次",ph:"例：1:30 睡、醒 1 次",now:1},
 {id:"split",r:1,t:"一字馬",mix:{len:100,str:30,ctl:60,rec:40},kw:{len:"髖、腿後側、內側拉開",str:"拉開的範圍要撐得住",ctl:"吐氣放鬆再往下",rec:"洗完澡趁熱做"},parts:["psoas","leg","lowback"],test:"一字馬離地幾公分（前、側各記）",ph:"例：前 20／側 35"},
 {id:"agile",r:1,t:"靈活",mix:{len:60,str:40,ctl:80,rec:50},kw:{len:"關節每天走全範圍",str:"有力才輕盈",ctl:"每天動一動",rec:"睡飽"},parts:["tspine","psoas","foot"],test:"早上起床的精神 0～10 分（指標）",ph:"例：6 分"},
 {id:"hh",r:1,t:"跳 HH",mix:{len:40,str:75,ctl:95,rec:30},kw:{len:"髖、胸椎打開",str:"臀、足踝、核心",ctl:"三腳架、懸掛軸線"},parts:["foot","leg","psoas","tspine"],test:"穿跟鞋單腳站穩幾秒",ph:"例：左 8 秒／右 12 秒"},
 {id:"posture",r:2,t:"體態很棒",mix:{len:60,str:70,ctl:90,rec:30},kw:{len:"鬆開代償鏈",str:"撐住正位",ctl:"三腳架、懸掛軸線"},parts:["foot","leg","psoas","abs","lowback","tspine","pec","neck"],test:"靠牆站：腰後塞得進拳頭嗎？後腦勺碰得到牆嗎？",ph:"例：塞得進拳頭、頭碰不到"},
 {id:"flat",r:2,t:"小腹平",mix:{len:20,str:60,ctl:50,rec:90},kw:{str:"深層核心",ctl:"骨盆回正、腹內壓",rec:"飲食決定體脂"},parts:["abs","psoas"],test:"每月在肚臍高度量一次腰圍",ph:"例：78 公分"},
 {id:"abs",r:2,t:"腹肌",mix:{len:10,str:95,ctl:40,rec:60},kw:{str:"腹肌加阻力練",ctl:"先會用深層核心",rec:"體脂夠低才看得見"},parts:["abs"],test:"先平再說：腰圍到目標後再記",ph:"例：還沒開始"}
];
const PI=id=>PARTS.findIndex(p=>p.id===id);
const ANG={len:0,str:90,ctl:180,rec:270};
let curGoal="pain";
const GANG={pain:335,loose:235,sleep:280,split:8,agile:200,hh:148,posture:122,flat:245,abs:100};
function gpos(g){const C=200,R=[52,112,162][g.r],a=GANG[g.id]*Math.PI/180;return [C+R*Math.cos(a),C+R*Math.sin(a),a];}
const LEVCOL={len:"鬆・伸",str:"醒・練",ctl:"醒＋三個意念",rec:"鬆＋呼吸＋睡眠"};
function renderFilter(){
  const el=$("#tfilter");if(!el)return;
  el.innerHTML=`<span class="tfl">用目標看</span><button class="tfc ${!tgoal?"on":""}" data-tg="">全部</button>${RINGS.map((r,ri)=>`<span class="tfr">${"①②③"[ri]}</span>${GOALS.filter(g=>g.r===ri).map(g=>`<button class="tfc ${tgoal===g.id?"on":""} ${g.now?"now":""}" data-tg="${g.id}">${g.t}</button>`).join("")}`).join("")}`;
}
function renderGoals(){
  const g=GOALS.find(x=>x.id===curGoal);const cw=colW(g);
  const quad=LEV.map(l=>{const a0=(ANG[l.k]-45)*Math.PI/180,a1=(ANG[l.k]+45)*Math.PI/180,R=186;
    return `<path class="q ${l.c}" d="M200 200 L${200+R*Math.cos(a0)} ${200+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${200+R*Math.cos(a1)} ${200+R*Math.sin(a1)}Z"/>`}).join("");
  const qlab=LEV.map(l=>{const a=ANG[l.k]*Math.PI/180,R=176;return `<text class="ql ${l.c}" x="${200+R*Math.cos(a)}" y="${200+R*Math.sin(a)}" data-lv="${l.k}">${l.n}</text>`}).join("");
  const rings=[87,137,186].map((r,i)=>`<circle class="rg r${i}" cx="200" cy="200" r="${r}"/><circle class="rg2" cx="200" cy="200" r="${r}"/>`).join("");
  const rlab=RINGS.map((rg,i)=>{const r=[70,122,172][i],a=52*Math.PI/180,x=200+r*Math.cos(a),y=200+r*Math.sin(a),w=58;return `<g class="rlg"><rect x="${x-w/2}" y="${y-11}" width="${w}" height="22" rx="11"/><text class="rl" x="${x}" y="${y}"><tspan class="rn">${"①②③"[i]}</tspan> ${rg.n}</text></g>`}).join("");
  const dots=GOALS.map(x=>{const [px,py,a]=gpos(x);const right=Math.cos(a)>-0.2;return `<g class="gd ${x.id===curGoal?"on":""} ${x.now?"now":""}" data-gsel="${x.id}"><circle cx="${px}" cy="${py}" r="${x.id===curGoal?9:6.5}"/><text x="${px+(right?11:-11)}" y="${py}" style="text-anchor:${right?"start":"end"}">${x.t}</text></g>`}).join("");
  $("#goals").innerHTML=`<div class="gl2"><span><b>第一性原理</b>身體只有四個開關</span><button class="scbtn" id="scene">看情境圖 ›</button></div><div class="levrow">${LEV.map(l=>`<button class="lv2 ${l.c}" data-lv="${l.k}"><b>${l.n}</b><span>${l.d}</span><em>部位桌：${LEVCOL[l.k]}</em></button>`).join("")}</div>
   <div class="gwrap">
    <div class="cbox"><div class="compass"><svg viewBox="0 0 400 400" role="img" aria-label="漣漪羅盤">${quad}${rings}${rlab}<text class="core" x="200" y="196">享受</text><text class="core" x="200" y="214">人生</text>${dots}${qlab}</svg></div>
     <div class="rleg">${RINGS.map((r,i)=>`<div><b>${"①②③"[i]} ${r.n}<i>${r.v}</i></b>${r.d}<span class="rw">${r.w}</span></div>`).join("")}</div></div>
    <div class="mixer">
      <div class="mtitle"><span class="mring">${"①②③"[g.r]} ${RINGS[g.r].n}・${RINGS[g.r].v}</span><h2>${g.t}${g.now?`<span class="nowtag">現在主線</span>`:""}</h2></div>
      <div class="faders">${LEV.map(l=>{const v=g.mix[l.k];return `<div class="fd ${l.c}"><button class="fl" data-lv="${l.k}">${l.n}</button><div class="tr"><i style="height:${v}%"></i><b style="bottom:calc(${v}% - 9px)"></b></div><span class="fv">${v}</span><small>${g.kw[l.k]||"—"}</small></div>`}).join("")}</div>
      <div class="mmap"><span>對應部位桌</span>
        <div class="mcols">${ST.map((s,si)=>`<i class="${s.c} ${cw[si]>=60?"hi":cw[si]>=40?"mid":"lo"}">${s.k}</i>`).join("")}</div>
        ${g.whole?`<span class="wb">全身＋呼吸為主</span>`:""}<div class="mparts">${g.parts.map(id=>`<button class="pn" data-p="${PI(id)}" title="${PARTS[PI(id)].n}">${PI(id)+1}</button>`).join("")}</div></div>
      <div class="macts"><button class="mbtn" data-goal="${g.id}">怎麼做、自我檢查</button><button class="mbtn pri" data-tgo="${g.id}">用這個目標看部位桌 ›</button></div>
    </div>
   </div>
   <div class="order">
     <div class="o1"><b>現在：① 三件一起做</b>睡前<em>鬆＋伸＋呼吸</em>；每天 2～3 個<em>醒</em>（收下巴、夾肩胛、橋式）；白天隨時<em>控制</em>；重訓課負責<em>練</em>。</div>
     <div><b>穩了再加</b>② 每週 1～2 次加一字馬和 HH 的準備。</div>
     <div><b>最後</b>③ 腹肌、小腹靠重訓和飲食，排在後面。</div>
     <div><b>保底 3 分</b>躺上床：360° 呼吸＋鬆最痛的地方。<button id="gFlow">我的流程 ›</button></div>
   </div>`;
  lightParts(g.parts.map(PI));
}
function openGoal(id){
  const g=GOALS.find(x=>x.id===id);
  const sc=$("#scrim");sc.hidden=false;
  const rows=LEV.filter(l=>g.kw[l.k]).sort((a,b)=>g.mix[b.k]-g.mix[a.k]);
  sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="meta">${"①②③"[g.r]} ${RINGS[g.r].n}</div><h2>${g.t}</h2>
    <div class="glv">${rows.map(l=>`<div class="${l.c}"><span class="lt">${g.mix[l.k]>=60?"主要":"輔助"}・${l.n}</span>${g.kw[l.k]}</div>`).join("")}</div>
    <p class="meta" style="margin-top:12px">對應部位（點了跳到部位桌）</p>
    <div class="gparts">${g.parts.map(pid=>{const pi=PI(pid);return `<button class="pn2" data-p="${pi}"><i>${pi+1}</i>${PARTS[pi].n}</button>`}).join("")}</div>
    <div class="warn" style="background:var(--bg)"><b style="color:var(--ink)">自我檢查</b>　${g.test}
      <label class="rec" for="gn_${g.id}">最近一次<input id="gn_${g.id}" data-gi="g_${g.id}" placeholder="${g.ph}" value="${(notes["g_"+g.id]||"").replace(/"/g,"&quot;")}"></label></div>
    <div class="acts"><button class="btn ghost" data-a="x" style="flex:1">關閉</button></div></div>`;
  sc.onclick=ev=>{if(ev.target===sc||ev.target.dataset.a==="x"){sc.hidden=true;return}
    const p=ev.target.closest(".pn2");if(p){sc.hidden=true;view("table");pick(+p.dataset.p,true)}};
}
function openScene(){
  const sc=$("#scrim");sc.hidden=false;
  sc.innerHTML=`<div class="sheet wide" role="dialog" aria-modal="true"><div class="meta">第一性原理</div><h2>身體是一頂帳篷</h2>
   <svg class="scene" viewBox="0 0 560 300" role="img" aria-label="帳篷桅杆的情境圖">
    <rect x="0" y="0" width="560" height="300" rx="14" class="sky"/>
    <circle cx="482" cy="58" r="22" class="moon"/><circle cx="492" cy="50" r="20" class="sky2"/>
    <text x="440" y="100" class="zz">z z</text>
    <line x1="0" y1="262" x2="560" y2="262" class="ground"/>
    <line x1="280" y1="262" x2="280" y2="52" class="ghost"/>
    <text x="288" y="44" class="gtxt">正位</text>
    <path d="M280 262 L232 60" class="mast"/>
    <path d="M232 60 L96 262" class="rope tight"/>
    <path d="M232 60 Q360 210 470 262" class="rope weak"/>
    <rect x="88" y="256" width="16" height="10" class="stake"/><rect x="462" y="256" width="16" height="10" class="stake"/>
    <circle cx="232" cy="60" r="7" class="knot"/>
    <g class="badge l1"><circle cx="138" cy="160" r="15"/><text x="138" y="160">1</text></g>
    <g class="badge l2"><circle cx="398" cy="196" r="15"/><text x="398" y="196">2</text></g>
    <g class="badge l3"><circle cx="196" cy="40" r="15"/><text x="196" y="40">3</text></g>
    <g class="badge l4"><circle cx="440" cy="40" r="15"/><text x="440" y="40">4</text></g>
    <text x="300" y="290" class="cap">桅杆＝骨架　繩子＝肌肉</text>
   </svg>
   <p class="how" style="margin-top:8px">桅杆歪掉，通常不是桅杆的錯，是兩邊的繩子不平衡：一邊太緊把它拉過去，另一邊沒力拉不回來。四個開關要一起調，桅杆才會站直。</p>
   <div class="scl">
    <div class="l1"><i>1</i><b>長度</b>這條繩太緊 → 放鬆、拉長。<em>部位桌：鬆・伸</em></div>
    <div class="l2"><i>2</i><b>力量</b>這條繩沒力、鬆垮 → 練強。<em>部位桌：醒・練</em></div>
    <div class="l3"><i>3</i><b>控制</b>大腦是營主，決定怎麼拉繩：足底三腳架、懸掛軸線、肋骨往下收。<em>白天隨時</em></div>
    <div class="l4"><i>4</i><b>恢復</b>晚上收工，繩子才恢復彈性：睡眠、呼吸、飲食。<em>睡前流程</em></div>
   </div>
   <div class="acts"><button class="btn ghost" data-a="x" style="flex:1">關閉</button></div></div>`;
  sc.onclick=ev=>{if(ev.target===sc||ev.target.dataset.a==="x")sc.hidden=true};
}
function openLever(k){
  const l=LEV.find(x=>x.k===k);const sc=$("#scrim");sc.hidden=false;
  sc.innerHTML=`<div class="sheet ${l.c}" role="dialog" aria-modal="true"><div class="meta"><span>${l.cols}</span></div><h2>${l.n}：${l.d}</h2>
    <p class="how">${l.prin}</p>
    <div class="ntab"><div class="nh">需要的作用</div><div class="nh">你有的</div><div class="nh">沒有時用</div>
    ${l.need.map(r=>`<div class="nk">${r[0]}</div><div>${r[1]}</div><div>${r[2]}</div>`).join("")}</div>
    <p class="meta" style="margin-top:10px">${GOALS.filter(g=>g.mix[k]>=80).map(g=>g.t).join("、")} 最靠這個開關</p>
    <div class="acts"><button class="btn ghost" data-a="x" style="flex:1">關閉</button></div></div>`;
  sc.onclick=ev=>{if(ev.target===sc||ev.target.dataset.a==="x")sc.hidden=true};
}
function lightParts(list){document.querySelectorAll(".dot").forEach(e=>e.classList.toggle("on",list.includes(+e.dataset.p)));}
function view(v){
  $("#goals").hidden=v!=="goal";$("#table").hidden=v!=="table";$("#pup").hidden=v!=="pup";$("#rx").hidden=v!=="rx";$("#tRx").classList.toggle("on",v==="rx");$("#tool").hidden=v!=="tool";$("#tTool").classList.toggle("on",v==="tool");if(v==="tool")renderTool();
  if(v!=="table"&&swap){swap=null;$("#swapbar").hidden=true;}
  if(v==="rx")renderRx();else rxHot(false);
  $("#tGoal").classList.toggle("on",v==="goal");$("#tTable").classList.toggle("on",v==="table");$("#tPup").classList.toggle("on",v==="pup");
  document.querySelector(".main").classList.toggle("solo",v==="pup");document.querySelector(".figbox").hidden=v==="pup";
  if(v==="pup")pupInit();
  try{localStorage.setItem("bedview",v)}catch(e){}
  if(v==="goal")renderGoals();
  if(v==="table"){renderFilter();render();if(tgoal){const G=GOALS.find(x=>x.id===tgoal);lightParts(G.parts.map(PI));const f=PARTS.findIndex(p=>p.id===G.parts[G.parts.length-1]);}}
}
$("#tRx").onclick=()=>view("rx");$("#tTool").onclick=()=>view("tool");$("#tGoal").onclick=()=>view("goal");$("#tPup").onclick=()=>view("pup");$("#tTable").onclick=()=>view("table");
document.addEventListener("input",e=>{const gi=e.target.dataset.gi;if(gi!==undefined){notes[gi]=e.target.value;persist()}});
document.addEventListener("click",e=>{
  if(e.target.id==="scene"){openScene();return}
  if(e.target.id==="gFlow"){view("rx");return}
  if(e.target.id==="gFlow2"){view("rx");return}
  if(e.target.id==="gTable")view("table");
  const tgo=e.target.closest("[data-tgo]");if(tgo){tgoal=tgo.dataset.tgo;view("table");return}
  const tg=e.target.closest("[data-tg]");if(tg){tgoal=tg.dataset.tg||null;renderFilter();render();if(tgoal){const G=GOALS.find(x=>x.id===tgoal);lightParts(G.parts.map(PI))}return}
  const gs=e.target.closest("[data-gsel]");if(gs){curGoal=gs.dataset.gsel;renderGoals();return}
  const gl=e.target.closest("[data-goal]");if(gl&&!e.target.closest(".pn")){openGoal(gl.dataset.goal);return}
  const lv=e.target.closest("[data-lv]");if(lv){openLever(lv.dataset.lv);return}
  const pn=e.target.closest(".pn");if(pn){view("table");pick(+pn.dataset.p,true)}
},true);
const _pick=pick;pick=function(pi,scroll){_pick(pi,scroll&&!$("#table").hidden);};
let v0="rx";
view(v0);pick(0,false);

if(INAPP){
  window.addEventListener("message",e=>{if(e.origin!==location.origin||!e.data||e.data.pg!=="state")return;loaded=true;if(e.data.data&&JSON.stringify({flow:e.data.data.flow,notes:e.data.data.notes})===JSON.stringify({flow,notes}))return;if(e.data.data){applyState(e.data.data);try{localStorage.setItem("origina.posture",JSON.stringify(e.data.data))}catch(x){}}render();if(!$("#goals").hidden)renderGoals();});
  try{parent.postMessage({pg:"get"},location.origin)}catch(e){}
  document.documentElement.classList.add("inapp");
}
</script>
